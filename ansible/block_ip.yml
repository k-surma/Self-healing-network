---
- name: Mitygacja Ataku - Izolacja zrodla
  hosts: vyos
  gather_facts: false  # Optymalizacja czasu reakcji
  tasks:
    - name: Wdrozenie reguly blokujacej (Blacklisting)
      vyos.vyos.vyos_config:
        lines:
          - set firewall group address-group BLOCKED_IPS address '{{ target_ip }}'
          - set firewall ipv4 forward filter rule 5 action 'drop'
          - set firewall ipv4 forward filter rule 5 source group address-group 'BLOCKED_IPS'
        save: yes
