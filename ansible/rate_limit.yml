---
- name: Mitygacja Wektora 3 - limiter ingress na WAN
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Ograniczenie ruchu wolumetrycznego do chronionego hosta
      vyos.vyos.vyos_config:
        lines:
          - set qos policy limiter DOS-INGRESS default bandwidth '{{ rate_limit_default_bandwidth }}'
          - set qos policy limiter DOS-INGRESS class 10 bandwidth '{{ rate_limit_bandwidth }}'
          - set qos policy limiter DOS-INGRESS class 10 burst '{{ rate_limit_burst }}'
          - set qos policy limiter DOS-INGRESS class 10 match ATTACK-FLOW ip destination address '{{ protected_ip }}'
          - set qos interface {{ rate_limit_interface }} ingress 'DOS-INGRESS'
        save: no
